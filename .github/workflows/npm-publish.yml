name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.21.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Prepare npm publishing auth
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is configured; validating token authentication."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
            npm whoami --registry=https://registry.npmjs.org
          else
            echo "NPM_TOKEN is not configured; publishing with npm trusted publishing (OIDC)."
            echo "Trusted publishing must allow repository '$GITHUB_REPOSITORY' and workflow '$GITHUB_WORKFLOW_REF'."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm verify
        env:
          CI: true
      - name: Publish packages
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN
          fi

          pnpm release
        env:
          CI: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
