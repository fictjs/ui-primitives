name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.21.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Verify npm publish token
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is required for the first publish of new @fictjs packages. npm trusted publishing can only be used after the packages exist and are configured as trusted publishers on npm."
            exit 1
          fi

          npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm verify
        env:
          CI: true
      - name: Publish packages
        run: pnpm release
        env:
          CI: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
