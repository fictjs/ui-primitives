name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          CI: true
      - name: Publish packages
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN authentication."
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "NPM_TOKEN is not set; publishing with npm trusted publishing (OIDC)."
            echo "Ensure every npm package is configured with this repository and workflow as a trusted publisher."
          fi

          pnpm release
        env:
          CI: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
