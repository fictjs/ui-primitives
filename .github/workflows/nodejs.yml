name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.31.0
          run_install: false
      - name: Use Node.js 22.21.1
        uses: actions/setup-node@v6
        with:
          node-version: 22.21.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package changesets
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since="origin/${{ github.base_ref }}"
      - name: Verify
        run: pnpm verify
        env:
          CI: true
      - name: Verify metadata consumer
        run: pnpm metadata:e2e
        env:
          CI: true
      - name: Install Playwright Chromium
        run: pnpm --filter @fictjs/radix-ui-themes-playground exec playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: pnpm --filter @fictjs/radix-ui-themes-playground test:e2e
        env:
          CI: true
